<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cesium GLB Placement</title>
  <link
    href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css"
    rel="stylesheet"
  />
  <style>
    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
  <script>
    const latitude = 28.660906136832967;
    const longitude = 77.12244684354997;
    const modelHeight = 0;
    const arcGisProvider =
      Cesium.ArcGisMapServerImageryProvider.fromUrl(
        "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      );

    const viewer = new Cesium.Viewer("cesiumContainer", {
      animation: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: true,
      infoBox: false,
      sceneModePicker: false,
      selectionIndicator: false,
      timeline: false,
      navigationHelpButton: true,
      baseLayer: Cesium.ImageryLayer.fromProviderAsync(arcGisProvider),
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    });

    const modelPosition = Cesium.Cartesian3.fromDegrees(longitude, latitude, modelHeight);

    const modelEntity = viewer.entities.add({
      name: "House (GLB)",
      position: modelPosition,
      model: {
        uri: "./new_house2nd_floor.optimized.glb",
        scale: 1.0,
        heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      },
    });

    viewer.zoomTo(modelEntity).catch(() => {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(longitude, latitude, 250),
      });
    });
  </script>
</body>
</html>

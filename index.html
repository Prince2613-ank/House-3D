<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Home</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Cpath fill="%232f6f3a" d="M8 30 32 10l24 20v24a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z"/%3E%3Cpath fill="%23ffffff" d="M26 58V38h12v20z"/%3E%3C/svg%3E'
  />
  <link
    rel="preload"
    href="./new_house2nd_floor_updated_unlit.web.glb"
    as="fetch"
    type="model/gltf-binary"
    crossorigin
  />
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    #appShell,
    #modelView,
    #mapView {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #mapView[hidden] {
      display: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.98);
      color: #f5f7fa;
      pointer-events: none;
    }

    #modeSwitch {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 60;
      display: flex;
      gap: 8px;
      padding: 6px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    #modeSwitch button {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #e5eef7;
      border-radius: 8px;
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }

    #modeSwitch button.active {
      background: rgba(125, 211, 252, 0.2);
      border-color: rgba(125, 211, 252, 0.7);
    }

    #hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 60;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: #d7e0ea;
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div id="appShell">
    <div id="modelView"></div>
    <div id="mapView" hidden></div>
  </div>

  <div id="modeSwitch" aria-label="View mode switch">
    <button id="modelModeBtn" class="active" type="button">Model</button>
    <button id="mapModeBtn" type="button">Map</button>
  </div>

  <div id="loadingOverlay">
    <div style="font-size:17px;font-weight:600;margin-bottom:8px;">Loading model…</div>
    <div id="loadingDetail" style="font-size:12px;color:#9fb2c4;">Preparing scene</div>
  </div>

  <div id="hint">Drag to rotate · Right-drag to pan · Scroll to zoom</div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const MODEL_URL = './new_house2nd_floor_updated_unlit.web.glb';
    const DRACO_URL = 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/libs/draco/gltf/';
    const SATELLITE_ATTRIBUTION = 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community';

    const INIT_MODEL_LNG = 77.122460;
    const INIT_MODEL_LAT = 28.660866;
    const INIT_CENTER = [77.122460, 28.660866];
    const INIT_ZOOM = 20.75;
    const INIT_PITCH = 32.4;
    const INIT_BEARING = 314.9;
    const INIT_HEIGHT = 4.0;
    const INIT_MODEL_SCALE = 0.98;
    const INIT_MODEL_PITCH = 1.6;
    const INIT_MODEL_BEARING = 268.3;

    const appShell = document.getElementById('appShell');
    const modelView = document.getElementById('modelView');
    const mapView = document.getElementById('mapView');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingDetail = document.getElementById('loadingDetail');
    const modelModeBtn = document.getElementById('modelModeBtn');
    const mapModeBtn = document.getElementById('mapModeBtn');
    const hint = document.getElementById('hint');

    const loader = new GLTFLoader();
    const draco = new DRACOLoader();
    draco.setDecoderPath(DRACO_URL);
    loader.setDRACOLoader(draco);

    let modelTemplatePromise = null;
    let modelTemplate = null;
    let activeMode = 'model';

    function loadModelTemplate() {
      if (modelTemplate) {
        return Promise.resolve(modelTemplate);
      }

      if (!modelTemplatePromise) {
        modelTemplatePromise = new Promise((resolve, reject) => {
          loader.load(
            MODEL_URL,
            (gltf) => {
              modelTemplate = gltf.scene;
              resolve(modelTemplate);
            },
            (event) => {
              if (loadingDetail && event.total) {
                const percent = Math.round((event.loaded / event.total) * 100);
                loadingDetail.textContent = `Downloading model… ${percent}%`;
              }
            },
            reject,
          );
        });
      }

      return modelTemplatePromise;
    }

    function cloneModel(root) {
      const clone = root.clone(true);
      clone.traverse((node) => {
        if (!node.isMesh) return;
        node.frustumCulled = false;
        if (Array.isArray(node.material)) {
          node.material = node.material.map((material) => material.clone());
        } else if (node.material) {
          node.material = node.material.clone();
        }
      });
      return clone;
    }

    function frameModel(camera, controls, object3d) {
      const box = new THREE.Box3().setFromObject(object3d);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      object3d.position.sub(center);

      const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;
      camera.near = Math.max(radius / 100, 0.01);
      camera.far = radius * 100;
      camera.updateProjectionMatrix();

      const distance = radius * 2.8;
      camera.position.set(distance, distance * 0.85, distance);
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    let modelScene = null;
    let modelCamera = null;
    let modelRenderer = null;
    let modelControls = null;
    let modelRoot = null;

    function initModelViewer() {
      modelScene = new THREE.Scene();
      modelScene.background = new THREE.Color(0x000000);

      modelCamera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 10000);
      modelRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
      modelRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      modelRenderer.setSize(window.innerWidth, window.innerHeight, false);
      modelRenderer.outputColorSpace = THREE.SRGBColorSpace;
      modelRenderer.toneMapping = THREE.ACESFilmicToneMapping;
      modelRenderer.toneMappingExposure = 1.05;
      modelView.appendChild(modelRenderer.domElement);

      modelControls = new OrbitControls(modelCamera, modelRenderer.domElement);
      modelControls.enableDamping = true;
      modelControls.dampingFactor = 0.08;
      modelControls.enablePan = true;
      modelControls.enableZoom = true;
      modelControls.enableRotate = true;

      const ambient = new THREE.AmbientLight(0xffffff, 2.2);
      const key = new THREE.DirectionalLight(0xffffff, 2.8);
      key.position.set(2, 5, 3);
      const fill = new THREE.DirectionalLight(0xffffff, 1.0);
      fill.position.set(-3, 2, -2);
      modelScene.add(ambient, key, fill);

      loadModelTemplate()
        .then((root) => {
          modelRoot = cloneModel(root);
          modelScene.add(modelRoot);
          frameModel(modelCamera, modelControls, modelRoot);
          if (activeMode === 'model' && loadingOverlay) {
            loadingOverlay.style.display = 'none';
          }
        })
        .catch((error) => {
          console.error('Failed to load model', error);
          if (loadingDetail) loadingDetail.textContent = 'Failed to load model';
        });

      const render = () => {
        if (activeMode !== 'model') return;
        modelControls.update();
        modelRenderer.render(modelScene, modelCamera);
      };

      modelRenderer.setAnimationLoop(render);
    }

    const mapStyle = {
      version: 8,
      sources: {
        satellite: {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          maxzoom: 19,
          attribution: SATELLITE_ATTRIBUTION,
        },
      },
      layers: [
        { id: 'black-bg', type: 'background', paint: { 'background-color': '#000000' } },
        { id: 'satellite', type: 'raster', source: 'satellite' },
      ],
    };

    let map = null;
    let mapScene = null;
    let mapCamera = null;
    let mapRenderer = null;
    let mapModelRoot = null;
    let mapLayerReady = false;
    const mapMatrix = new THREE.Matrix4();
    const mapLocalMatrix = new THREE.Matrix4();
    const mapRotX = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), Math.PI / 2);
    let mapModelLng = INIT_MODEL_LNG;
    let mapModelLat = INIT_MODEL_LAT;
    let mapModelHeight = INIT_HEIGHT;
    let mapModelScale = INIT_MODEL_SCALE;
    let mapModelPitch = INIT_MODEL_PITCH;
    let mapModelBearing = INIT_MODEL_BEARING;
    let mapScale = maplibregl.MercatorCoordinate.fromLngLat([mapModelLng, mapModelLat], 0).meterInMercatorCoordinateUnits();

    function updateMapLocalMatrix() {
      const origin = maplibregl.MercatorCoordinate.fromLngLat([mapModelLng, mapModelLat], 0);
      mapScale = origin.meterInMercatorCoordinateUnits();
      const heightMercator = maplibregl.MercatorCoordinate.fromLngLat([mapModelLng, mapModelLat], mapModelHeight).z;
      const bearingMatrix = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0, 0, 1), THREE.MathUtils.degToRad(mapModelBearing));
      const pitchMatrix = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), THREE.MathUtils.degToRad(mapModelPitch));
      const scaleMatrix = new THREE.Matrix4().makeScale(
        mapScale * mapModelScale,
        -mapScale * mapModelScale,
        mapScale * mapModelScale,
      );

      mapLocalMatrix
        .makeTranslation(origin.x, origin.y, heightMercator)
        .multiply(bearingMatrix)
        .multiply(pitchMatrix)
        .multiply(scaleMatrix)
        .multiply(mapRotX);
    }

    function cloneForMap(root) {
      const clone = cloneModel(root);
      clone.traverse((node) => {
        if (node.isMesh) {
          node.material.side = THREE.DoubleSide;
        }
      });
      return clone;
    }

    function initMapViewer() {
      if (map) {
        return;
      }

      updateMapLocalMatrix();
      mapView.hidden = false;
      map = new maplibregl.Map({
        container: mapView,
        style: mapStyle,
        center: INIT_CENTER,
        zoom: INIT_ZOOM,
        pitch: INIT_PITCH,
        bearing: INIT_BEARING,
        antialias: true,
      });
      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      map.on('load', () => {
        mapScene = new THREE.Scene();
        mapCamera = new THREE.Camera();
        mapRenderer = new THREE.WebGLRenderer({
          canvas: map.getCanvas(),
          context: map.getCanvas().getContext('webgl2', { antialias: true }) || map.getCanvas().getContext('webgl', { antialias: true }),
          antialias: true,
        });
        mapRenderer.autoClear = false;
        mapRenderer.outputColorSpace = THREE.SRGBColorSpace;
        mapRenderer.toneMapping = THREE.ACESFilmicToneMapping;
        mapRenderer.toneMappingExposure = 1.05;

        const ambient = new THREE.AmbientLight(0xffffff, 2.0);
        const sun = new THREE.DirectionalLight(0xffffff, 2.4);
        sun.position.set(1, 2, 1);
        mapScene.add(ambient, sun);

        const customLayer = {
          id: 'house-3d',
          type: 'custom',
          renderingMode: '3d',
          onAdd(mapInstance, gl) {
            this.map = mapInstance;
            this.camera = mapCamera;
            this.scene = mapScene;
            this.renderer = mapRenderer;
            this.renderer.resetState();

            loadModelTemplate()
              .then((root) => {
                if (mapModelRoot) {
                  this.scene.remove(mapModelRoot);
                }
                mapModelRoot = cloneForMap(root);
                this.scene.add(mapModelRoot);
                updateMapLocalMatrix();
                mapInstance.triggerRepaint();
                if (activeMode === 'map' && loadingOverlay) {
                  loadingOverlay.style.display = 'none';
                }
              })
              .catch((error) => {
                console.error('Failed to load model for map mode', error);
                if (loadingDetail) loadingDetail.textContent = 'Failed to load model';
              });
          },
          render(gl, args) {
            const matrixArray = Array.isArray(args) || ArrayBuffer.isView(args)
              ? args
              : args?.defaultProjectionData?.mainMatrix ?? args?.modelViewProjectionMatrix;
            if (!matrixArray || !mapRenderer || !mapCamera) return;

            mapMatrix.fromArray(matrixArray).multiply(mapLocalMatrix);
            mapCamera.projectionMatrix = mapMatrix;
            mapRenderer.resetState();
            mapRenderer.render(mapScene, mapCamera);
            this.map.triggerRepaint();
          },
        };

        if (!map.getLayer('house-3d')) {
          map.addLayer(customLayer);
        }
        mapLayerReady = true;
        if (activeMode === 'map' && loadingOverlay) {
          loadingOverlay.style.display = 'none';
        }
      });
    }

    function setMode(mode) {
      activeMode = mode;
      const modelActive = mode === 'model';
      modelModeBtn.classList.toggle('active', modelActive);
      mapModeBtn.classList.toggle('active', !modelActive);
      modelView.hidden = !modelActive;
      mapView.hidden = modelActive;
      hint.textContent = modelActive
        ? 'Drag to rotate · Right-drag to pan · Scroll to zoom'
        : 'Map mode active · Drag the map · Use zoom controls';

      if (modelActive) {
        if (loadingOverlay && modelRoot) {
          loadingOverlay.style.display = 'none';
        }
        modelRenderer?.setAnimationLoop(() => {
          if (activeMode !== 'model') return;
          modelControls.update();
          modelRenderer.render(modelScene, modelCamera);
        });
        modelRenderer?.render(modelScene, modelCamera);
        if (map) map.resize();
        return;
      }

      if (loadingOverlay && !mapLayerReady) {
        loadingOverlay.style.display = 'flex';
        if (loadingDetail) loadingDetail.textContent = 'Loading map view…';
      }

      initMapViewer();
      if (map) {
        map.resize();
        map.triggerRepaint();
      }
    }

    function onResize() {
      if (modelCamera && modelRenderer) {
        modelCamera.aspect = window.innerWidth / window.innerHeight;
        modelCamera.updateProjectionMatrix();
        modelRenderer.setSize(window.innerWidth, window.innerHeight, false);
        modelControls?.update();
      }
      if (map) {
        map.resize();
      }
    }

    modelModeBtn.addEventListener('click', () => setMode('model'));
    mapModeBtn.addEventListener('click', () => setMode('map'));
    window.addEventListener('resize', onResize);

    initModelViewer();
    setMode('model');
  </script>
</body>
</html>
